<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกข้อมูลเวรฯแก้ไฟ กฟส.บัวลาย</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
    body { background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
    .container { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 560px; margin-top: 10px; }
    h2 { text-align: center; color: #1e293b; margin-top: 0; }
    .row-2col { display: flex; gap: 12px; }
    .row-2col .form-group, .row-2col button { flex: 1; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: #475569; font-size: 14px; font-weight: 500; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; background-color: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    button { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }
    .btn-list { background-color: #0d9488; }
    .btn-list:hover { background-color: #0f766e; }
    .btn-logout { background-color: #ef4444; padding: 6px 12px; font-size: 13px; width: auto; margin: 0; }
    .btn-logout:hover { background-color: #dc2626; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
    .hidden { display: none; }
    .alert { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; text-align: center; }
    .alert-error { background-color: #fee2e2; color: #b91c1c; }
    .alert-success { background-color: #dcfce7; color: #15803d; }

    /* ส่วนแสดงตารางรายการ */
    .records-box { margin-top: 25px; border-top: 2px solid #e2e8f0; padding-top: 18px; }
    .records-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
    .records-header h3 { margin: 0; font-size: 15px; color: #1e293b; }
    .btn-close-list { background-color: #64748b; padding: 4px 10px; font-size: 12px; width: auto; margin: 0; white-space: nowrap; }
    .btn-close-list:hover { background-color: #475569; }
    .table-wrap { overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 460px; }
    th { background-color: #f1f5f9; color: #334155; font-weight: 600; text-align: left; padding: 9px 10px; border-bottom: 1px solid #cbd5e1; }
    td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; color: #1e293b; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background-color: #f8fafc; }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 12px; font-weight: 500; }
    .badge-day { background-color: #fef3c7; color: #b45309; }
    .badge-night { background-color: #e0e7ff; color: #3730a3; }
  </style>
</head>
<body>

  <!-- หน้าจอ Login -->
  <div id="loginSection" class="container">
    <h2>เข้าสู่ระบบบันทึกข้อมูล</h2>
    <div id="loginAlert" class="alert alert-error hidden"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>ชื่อผู้ใช้งาน (Username)</label>
        <input type="text" id="username" required placeholder="กรอกชื่อผู้ใช้งาน">
      </div>
      <div class="form-group">
        <label>รหัสผ่าน (Password)</label>
        <input type="password" id="password" required placeholder="กรอกรหัสผ่าน">
      </div>
      <button type="submit" id="loginBtn">เข้าสู่ระบบ</button>
    </form>
  </div>

  <!-- หน้าจอฟอร์มกรอกข้อมูล -->
  <div id="formSection" class="container hidden">
    <div class="header-bar">
      <div>
        <strong style="color:#1e293b;">บันทึกข้อมูลปฏิบัติงาน</strong><br>
        <small style="color:#64748b;">ผู้ใช้งาน: <span id="currentUserDisplay"></span></small>
      </div>
      <button type="button" class="btn-logout" onclick="logout()">ออกจากระบบ</button>
    </div>

    <div id="formAlert" class="alert hidden"></div>

    <form id="recordForm">
      <div class="row-2col">
        <div class="form-group">
          <label>วันที่เข้าเวรฯ *</label>
          <input type="date" id="workDate" required>
        </div>
        <div class="form-group">
          <label>เวลา (กะทำงาน) *</label>
          <select id="workTime" required>
            <option value="08.30-16.30">08:30 น.-16:30 น.</option>
            <option value="16.30-08.30">16:30 น.-08:30 น.</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>ชื่อพนักงาน *</label>
        <select id="staffSelect" required onchange="onStaffChange()">
          <option value="">-- เลือกรายชื่อพนักงาน --</option>
        </select>
      </div>

      <div class="form-group">
        <label>เบอร์โทรพนักงาน *</label>
        <input type="tel" id="staffPhone" required placeholder="เลือกชื่อพนักงานเพื่อดึงเบอร์อัตโนมัติ">
      </div>

      <div class="form-group">
        <label>ชื่อคนงาน *</label>
        <select id="workerSelect" required>
          <option value="">-- เลือกรายชื่อคนงาน --</option>
        </select>
      </div>

      <div class="form-group">
        <label>หมายเหตุ / รายละเอียดงาน</label>
        <textarea id="note" rows="2" placeholder="ระบุรายละเอียดเพิ่มเติม (ถ้ามี)"></textarea>
      </div>

      <div class="row-2col">
        <button type="submit" id="submitBtn">บันทึกข้อมูล</button>
        <button type="button" id="showListBtn" class="btn-list" onclick="toggleRecordsList()">แสดงรายการ</button>
      </div>
    </form>

    <!-- ส่วนแสดงรายการเวรฯ เดือนปัจจุบัน -->
    <div id="recordsSection" class="records-box hidden">
      <div class="records-header">
        <h3 id="recordsTitle">รายการเวรฯ เดือนปัจจุบัน</h3>
        <button type="button" class="btn-close-list" onclick="hideRecordsList()">ซ่อน</button>
      </div>
      <div id="recordsTableContainer" class="table-wrap"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyec0BDbfIc8JHniH7487XLcdhWwubdyIOAG709mCEdIOVmMcVx6xBNTD9p87CimFfF/exec";

    let currentUser = "";
    let staffDataList = [];

    function setDefaultDate() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      document.getElementById('workDate').value = `${yyyy}-${mm}-${dd}`;
    }

    function populateStaffDropdown(list) {
      staffDataList = list;
      const select = document.getElementById('staffSelect');
      select.innerHTML = '<option value="">-- เลือกรายชื่อพนักงาน --</option>';
      list.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.name;
        opt.textContent = item.name;
        select.appendChild(opt);
      });
    }

    function populateWorkerDropdown(list) {
      const select = document.getElementById('workerSelect');
      select.innerHTML = '<option value="">-- เลือกรายชื่อคนงาน --</option>';
      list.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        opt.textContent = item;
        select.appendChild(opt);
      });
    }

    function onStaffChange() {
      const selectedName = document.getElementById('staffSelect').value;
      const phoneInput = document.getElementById('staffPhone');
      const found = staffDataList.find(s => s.name === selectedName);
      phoneInput.value = found ? String(found.phone).replace(/[\s-]/g, '') : "";
    }

    async function callAppsScript(payload) {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      return await response.json();
    }

    function formatThaiShortDate(dateStr) {
      const parts = String(dateStr).split('-');
      if (parts.length !== 3) return dateStr;
      const thaiYear = parseInt(parts[0], 10) + 543;
      return `${parts[2]}/${parts[1]}/${thaiYear}`;
    }

    // ดึงและแสดงตารางรายการเดือนปัจจุบันทั้งหมด
    async function toggleRecordsList() {
      const btn = document.getElementById('showListBtn');
      const section = document.getElementById('recordsSection');
      const titleEl = document.getElementById('recordsTitle');
      const container = document.getElementById('recordsTableContainer');

      btn.disabled = true;
      btn.textContent = "กำลังโหลด...";

      try {
        const res = await callAppsScript({ action: "getRecords" });
        btn.disabled = false;
        btn.textContent = "แสดงรายการ";

        if (res.success) {
          titleEl.textContent = `รายการเวรฯ เดือน${res.monthLabel} (${res.records.length} รายการ)`;
          
          if (res.records.length === 0) {
            container.innerHTML = `<div style="padding:15px; text-align:center; color:#64748b;">ยังไม่มีข้อมูลเวรฯ ในเดือน${res.monthLabel}</div>`;
          } else {
            let html = `<table>
              <thead>
                <tr>
                  <th>วันที่ / กะ</th>
                  <th>พนักงานช่าง</th>
                  <th>คนงาน</th>
                  <th>หมายเหตุ</th>
                </tr>
              </thead>
              <tbody>`;
            res.records.forEach(r => {
              const badgeClass = r.workTime.startsWith('08') ? 'badge-day' : 'badge-night';
              html += `<tr>
                <td>
                  <strong>${formatThaiShortDate(r.workDate)}</strong><br>
                  <span class="badge ${badgeClass}">${r.workTime}</span>
                </td>
                <td>${r.staffName}<br><small style="color:#64748b;">${r.staffPhone}</small></td>
                <td>${r.workerName}</td>
                <td>${r.note || '-'}</td>
              </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
          }
          section.classList.remove('hidden');
        } else {
          alert(res.message);
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "แสดงรายการ";
        alert("ไม่สามารถโหลดรายการได้ กรุณาลองใหม่อีกครั้ง");
      }
    }

    function hideRecordsList() {
      document.getElementById('recordsSection').classList.add('hidden');
    }

    // จัดการการ Login
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const btn = document.getElementById('loginBtn');
      const alertBox = document.getElementById('loginAlert');

      btn.disabled = true;
      btn.textContent = "กำลังโหลดข้อมูล...";
      alertBox.classList.add('hidden');

      try {
        const res = await callAppsScript({
          action: "login",
          username: user,
          password: pass
        });

        btn.disabled = false;
        btn.textContent = "เข้าสู่ระบบ";

        if (res.success) {
          currentUser = res.user;
          document.getElementById('currentUserDisplay').textContent = currentUser;
          
          populateStaffDropdown(res.staffList);
          populateWorkerDropdown(res.workerList);
          setDefaultDate();

          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('formSection').classList.remove('hidden');
          document.getElementById('loginForm').reset();
        } else {
          alertBox.textContent = res.message;
          alertBox.classList.remove('hidden');
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "เข้าสู่ระบบ";
        alertBox.textContent = "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาตรวจสอบ Web App URL";
        alertBox.classList.remove('hidden');
      }
    });

    // จัดการการบันทึกข้อมูล
    document.getElementById('recordForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('formAlert');

      const payload = {
        action: "save",
        workDate: document.getElementById('workDate').value,
        workTime: document.getElementById('workTime').value,
        staffName: document.getElementById('staffSelect').value,
        staffPhone: document.getElementById('staffPhone').value.replace(/[\s-]/g, '').trim(),
        workerName: document.getElementById('workerSelect').value,
        note: document.getElementById('note').value.trim(),
        recordedBy: currentUser
      };

      btn.disabled = true;
      btn.textContent = "กำลังบันทึก...";
      alertBox.classList.add('hidden');

      try {
        const res = await callAppsScript(payload);

        btn.disabled = false;
        btn.textContent = "บันทึกข้อมูล";
        alertBox.textContent = res.message;
        alertBox.className = res.success ? "alert alert-success" : "alert alert-error";
        alertBox.classList.remove('hidden');

        if (res.success) {
          document.getElementById('recordForm').reset();
          setDefaultDate();
          if (!document.getElementById('recordsSection').classList.contains('hidden')) {
            toggleRecordsList();
          }
          setTimeout(() => alertBox.classList.add('hidden'), 3500);
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "บันทึกข้อมูล";
        alertBox.textContent = "บันทึกข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้ง";
        alertBox.className = "alert alert-error";
        alertBox.classList.remove('hidden');
      }
    });

    function logout() {
      currentUser = "";
      hideRecordsList();
      document.getElementById('formSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('formAlert').classList.add('hidden');
    }
  </script>
</body>
</html>
